name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace "^refs/tags/v", ""

          # 统一为 4 段版本号（v1.2.3 → 1.2.3.0，v0.0.0.2 → 0.0.0.2）
          $parts = $tag -split "\."
          while ($parts.Count -lt 4) { $parts += "0" }
          $v4 = $parts[0..3]
          $dotted  = $v4 -join "."
          $comma   = $v4 -join ", "
          $tupled  = "($comma)"

          Write-Host "Version: $dotted  Tuple: $tupled"

          # --- file_version_info.txt ---
          $fi = Get-Content file_version_info.txt -Raw
          $fi = $fi -replace 'filevers=\([^)]+\)', "filevers=$tupled"
          $fi = $fi -replace 'prodvers=\([^)]+\)', "prodvers=$tupled"
          $fi = $fi -replace "FileVersion',\s*u'[^']*'", "FileVersion', u'$comma'"
          $fi = $fi -replace "ProductVersion',\s*u'[^']*'", "ProductVersion', u'$dotted'"
          Set-Content file_version_info.txt $fi -NoNewline

          # --- svc_edit/api.py ---
          $api = Get-Content svc_edit/api.py -Raw
          $api = $api -replace '"version":\s*"[^"]*"', "`"version`": `"$dotted`""
          Set-Content svc_edit/api.py $api -NoNewline

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: svc-edit
          path: dist/svc-edit.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: svc-edit
          path: ./assets

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "assets/svc-edit.exe"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
